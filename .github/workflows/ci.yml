name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: [22, 24]
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check:provider
      - run: npm run generate:check
      - run: npm run types:worker:check
      - run: npm run typecheck
      - name: Build production CLI and run Node and Worker tests
        run: npm test
      - name: Apply and check local D1 migrations
        run: |
          npx wrangler d1 migrations apply DB --local --persist-to "$RUNNER_TEMP/capy-d1"
          npx wrangler d1 migrations list DB --local --persist-to "$RUNNER_TEMP/capy-d1"
      - name: Dry-run Worker and drive signed browser onboarding
        run: |
          CHROMIUM_BIN="$(command -v google-chrome || command -v chromium)"
          export CHROMIUM_BIN
          npm run test:browser-consent
      - run: npm pack --dry-run
      - run: npm run check:artifacts
      - run: npm audit --audit-level=high
      - run: git diff --check
